<app-modal-layout>
  <div body>
    <!-- Filtro por data -->
    <div class="p-3 pb-2 flex align-items-end gap-2">
      <div class="flex flex-column gap-1 flex-1">
        <label class="font-medium text-700 text-sm">Filtrar por data</label>
        <p-datepicker
          [(ngModel)]="filtroData"
          [showIcon]="true"
          dateFormat="dd/mm/yy"
          [showOnFocus]="false"
          placeholder="Selecione uma data"
          [showClear]="true"
          appendTo="body"
          class="w-full"
        />
      </div>
      <p-button icon="pi pi-search" pTooltip="Buscar" tooltipPosition="top" [loading]="carregando()" (onClick)="onBuscar()" />
    </div>

    <!-- Tabela de auditoria -->
    <div class="px-3 pb-3">
      @if (carregando()) {
        <div class="flex justify-content-center align-items-center p-4">
          <i class="pi pi-spin pi-spinner text-2xl text-primary"></i>
        </div>
      }

      @if (!carregando()) {
        <p-table [value]="auditorias()" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5, 10, 20]">
          <ng-template pTemplate="header">
            <tr>
              <th class="w-2">Operação</th>
              <th class="w-3">Data / Hora</th>
              <th class="w-2">Usuário</th>
              <th class="w-1 text-center">Dados</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-registro>
            <tr>
              <td>
                <p-tag [value]="labelTipo(registro.tipo)" [severity]="severidadeTipo(registro.tipo)" />
              </td>
              <td>{{ registro.dataHora | date: 'dd/MM/yyyy HH:mm:ss' }}</td>
              <td>{{ registro.usuario || '—' }}</td>
              <td class="text-center">
                @if (registro.dados) {
                  <p-button icon="pi pi-eye" [text]="true" pTooltip="Ver dados" tooltipPosition="top" (onClick)="onVerDados(registro.dados)" />
                }
              </td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="4" class="text-center py-4">
                <i class="pi pi-info-circle text-4xl text-500 mb-3 block"></i>
                <p class="text-500">Nenhum registro de auditoria encontrado.</p>
              </td>
            </tr>
          </ng-template>
        </p-table>
      }
    </div>
  </div>

  <span footer></span>
  <span footer class="flex gap-2">
    <p-button label="Fechar" icon="pi pi-times" severity="secondary" (onClick)="onFechar()" />
  </span>
</app-modal-layout>

<!-- Sub-dialog: visualizar dados JSON -->
<p-dialog
  [(visible)]="exibirDialogJson"
  header="Dados do Registro"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '50vw' }"
  [baseZIndex]="10001"
>
  <pre class="text-sm surface-100 border-round p-3" style="overflow-x: auto; white-space: pre-wrap">{{ dadosJson | json }}</pre>
  <ng-template pTemplate="footer">
    <p-button label="Fechar" icon="pi pi-times" severity="secondary" (onClick)="exibirDialogJson = false" />
  </ng-template>
</p-dialog>
