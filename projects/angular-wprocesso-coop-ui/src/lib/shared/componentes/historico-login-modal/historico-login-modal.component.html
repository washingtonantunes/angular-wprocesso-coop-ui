<app-modal-layout>
  <div body>
    @if (!carregando()) {
      <p-table
        [value]="historicos()"
        [paginator]="true"
        [rows]="porPagina()"
        [totalRecords]="totalRegistros()"
        [rowsPerPageOptions]="[5, 10, 20]"
        [lazy]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
        [showCurrentPageReport]="true"
        (onPage)="onPageChange($event)"
      >
        <ng-template pTemplate="header">
          <tr>
            <th class="w-3">Data / Hora</th>
            <th class="w-2 text-center">Resultado</th>
            <th>IP</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-historico>
          <tr>
            <td>{{ historico.dataHora | date: 'dd/MM/yyyy HH:mm:ss' }}</td>
            <td class="text-center">
              <p-tag [value]="historico.sucesso ? 'Sucesso' : 'Falha'" [severity]="historico.sucesso ? 'success' : 'danger'" />
            </td>
            <td>{{ historico.ip || '—' }}</td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="text-center py-4">
              <i class="pi pi-info-circle text-4xl text-500 mb-3 block"></i>
              <p class="text-500">Nenhum histórico de login encontrado.</p>
            </td>
          </tr>
        </ng-template>
      </p-table>
    }
  </div>

  <span footer></span>
  <span footer class="flex gap-2">
    <p-button label="Fechar" icon="pi pi-times" severity="secondary" (onClick)="onFechar()" />
  </span>
</app-modal-layout>
